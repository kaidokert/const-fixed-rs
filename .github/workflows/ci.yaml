# GitHub Actions port of upstream's etc/gitlab-ci.yml and etc/appveyor.yml, which stay
# untouched so that upstream merges don't conflict on them.
name: CI
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0' # 00:00 Sunday
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MSRV: 1.93.0
  ALL_FEATURES: fail-on-warnings arbitrary borsh defmt num-traits serde std

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  clippy:
    name: clippy (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Upstream's tidy job: every optional feature on its own, all of them together, and none.
        features:
          - fail-on-warnings arbitrary borsh defmt num-traits serde std
          - fail-on-warnings arbitrary
          - fail-on-warnings borsh
          - fail-on-warnings compat-readonly-static
          - fail-on-warnings defmt
          - fail-on-warnings num-traits
          - fail-on-warnings serde
          - fail-on-warnings serde-str
          - fail-on-warnings std
          - fail-on-warnings
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --features "${{ matrix.features }}"

  test:
    name: test (${{ matrix.rust }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rust: stable, target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { rust: beta, target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { rust: stable, target: i686-unknown-linux-gnu, os: ubuntu-latest }
          # defmt needs its linker markers, which MSVC lacks; upstream's AppVeyor job also
          # leaves defmt out on Windows.
          - rust: stable
            target: x86_64-pc-windows-msvc
            os: windows-latest
            features: fail-on-warnings arbitrary borsh num-traits serde std
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.target }}
      - if: matrix.target == 'i686-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo test --target ${{ matrix.target }} --features "${{ matrix.features || env.ALL_FEATURES }}"
        shell: bash
      - run: cargo test --release --target ${{ matrix.target }} --features "${{ matrix.features || env.ALL_FEATURES }}"
        shell: bash

  msrv:
    name: test (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib --features "fail-on-warnings num-traits std"
      - run: cargo test --release --lib --features "fail-on-warnings num-traits std"

  nightly:
    name: test (nightly-float)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features "fail-on-warnings nightly-float"

  # Every other job builds with the default const-num-traits feature. This one checks upstream's
  # configuration without it: no default features, and upstream num-traits on its own.
  no-default:
    name: no default features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --no-default-features --features "fail-on-warnings"
      - run: cargo clippy --all-targets --no-default-features --features "fail-on-warnings num-traits std"
      - run: cargo test --no-default-features --features "fail-on-warnings num-traits std"

  success:
    name: Success
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, msrv, nightly, no-default]
    # A single required check for branch protection. `if: always()` and the explicit result scan
    # are needed because GitHub counts a job skipped by a failed dependency as success.
    if: always()
    steps:
      - name: check if any dependency failed
        run: jq --exit-status 'all(.result == "success")' <<< '${{ toJson(needs) }}'
